<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Turnaj mistrů 2 • Naše šipky</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f7fb;background:#101522}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:15px 13px 90px}h1{font-size:29px;margin:12px 0 4px}h2{font-size:19px;margin:0 0 12px}h3{margin:12px 0 6px;font-size:16px}p{color:#bac4d5;line-height:1.45}.sub,.muted{font-size:13px;color:#a7b5c8}.panel{background:#1b2434;border:1px solid #344155;border-radius:18px;padding:16px;margin:13px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #50617b;border-radius:12px;background:#2b3a51;color:white;font:inherit;font-weight:700;padding:11px 14px;min-height:45px;cursor:pointer}.btn:disabled{opacity:.32;cursor:default}.btn:active{transform:scale(.99)}.primary{background:#f1c65b;color:#171b22;border-color:#f1c65b}.danger{background:#462733;border-color:#8b4353}.small{padding:7px 10px;min-height:35px;font-size:13px}.wide{width:100%;margin-top:9px}.score{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:#111a29;margin:8px 0;border-left:6px solid var(--c)}.points{font-size:27px;font-weight:850}.name{font-weight:800}.hidden{display:none!important}input,select{font:inherit;background:#0e1727;color:#fff;border:1px solid #54647c;border-radius:10px;padding:11px;min-height:43px;max-width:100%}input[type=color]{width:51px;min-width:51px;height:45px;padding:3px;cursor:pointer}.player{padding:9px 0;border-bottom:1px solid #354158}.player input[type=text]{flex:1;min-width:100px;width:120px}.player .order{width:55px}.pill{border:1px solid #52637a;border-radius:999px;padding:5px 9px;font-size:12px;color:#d7e1ee}.game{padding:12px;border:1px solid #3e5068;border-radius:12px;margin:8px 0;background:#141e2d}.game.selected{border-color:#f1c65b;background:#303043}.game:disabled{opacity:.4}.choice{display:flex;align-items:center;gap:9px;margin:10px 0;cursor:pointer}.choice input{min-height:auto}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;border:1px solid #54647c;border-radius:11px;background:#111a29;color:#fff;cursor:pointer}.chip.on{background:#f1c65b;color:#111}.result{padding:10px;border-bottom:1px solid #3b4b60}.notice{padding:12px;border-radius:12px;background:#293449;border:1px solid #5a6b82}.success{border-color:#80c895}.title{font-size:13px;letter-spacing:.1em;color:#f1c65b;font-weight:850}.rank{font-weight:900;min-width:32px}.tag{display:inline-block;background:#344259;border-radius:8px;padding:4px 7px;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f1c65b;outline-offset:2px}
.next-pick{padding:17px 16px;margin:12px 0 17px;border-radius:16px;border:2px solid var(--player-color,#f1c65b);background:color-mix(in srgb,var(--player-color,#f1c65b) 13%,#172033);box-shadow:0 0 0 1px color-mix(in srgb,var(--player-color,#f1c65b) 25%,transparent)}.next-pick-label{font-size:15px;font-weight:850;letter-spacing:.05em;color:#fff;margin-bottom:8px}.next-pick-name{font-size:clamp(25px,6vw,37px);font-weight:950;line-height:1.1;color:var(--player-color,#f1c65b);overflow-wrap:anywhere}.next-pick-detail{font-size:16px;font-weight:700;color:#e4ebf5;margin-top:8px}
.tournament-game-frame{width:100%;height: min(83vh,1050px);min-height:650px;border:1px solid #455773;border-radius:14px;background:#111827}.game-embed-note{font-size:13px;color:#b8c9df;margin:8px 0}.game-result-note{border:2px solid #a2e635;background:#24352d;border-radius:12px;padding:12px;margin:10px 0;font-weight:750}
</style></head><body><main><div class="title">NAŠE ŠIPKY • TURNAJ</div><h1>🏆 Turnaj mistrů</h1><p class="sub">Nová turnajová tabulka • 6 disciplín propojeno • vše se automaticky ukládá</p><section id="setup" class="panel"></section><section id="play" class="hidden"><div id="summary" class="panel"></div><div id="scores" class="panel"></div><div id="choose" class="panel"></div><div id="history" class="panel"></div></section><div class="sub">Uložení funguje v tomto prohlížeči a na této adrese. Původní turnajová tabulka zůstává nedotčená.</div></main><script>
'use strict';
const G=[{id:'high',name:'Nejvyšší skóre',tier:1},{id:'around',name:'Hodiny',tier:1},{id:'fives',name:'Násobek pěti',tier:2},{id:'x01',name:'X01',tier:3},{id:'obstacles',name:'Překážky',tier:5},{id:'cricket',name:'Cricket',tier:3},{id:'eliminace',name:'Eliminace',tier:3},{id:'vyrazko',name:'Vyřazko',tier:2},{id:'scram',name:'SCRAM Cricket',tier:5},{id:'golf',name:'Golf',tier:5},{id:'shanghai',name:'Shanghai',tier:3},{id:'clovece',name:'Člověče, nezlob se',tier:5}];
const KEY='naseSipkyTurnajV2',PROFILES='naseSipkyProfilyV1';const COLORS=['#F542B8','#A2E635','#38bdf8','#f59e0b','#a78bfa','#fb7185','#2dd4bf','#e2e8f0'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>[{name:'SÁJA',color:COLORS[0],id:crypto.randomUUID()},{name:'VOKUREK',color:COLORS[1],id:crypto.randomUUID()}];
const initial=()=>({players:defaults(),started:false,mode:'winner',order:'manual',history:[],active:null,finished:false,tiebreaks:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}if(!S||!Array.isArray(S.players)||!Array.isArray(S.history))S=initial();
let profiles={};try{profiles=JSON.parse(localStorage.getItem(PROFILES))||{}}catch{};
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(PROFILES,JSON.stringify(profiles))};
function remember(p){let n=p.name.trim();if(n)profiles[n.toLocaleLowerCase('cs')]={name:n,color:p.color};save()}
function playerIndex(id){return S.players.findIndex(p=>p.id===id)}
function updateName(id,v){let p=S.players.find(p=>p.id===id);if(!p)return;p.name=v;save();let matches=Object.values(profiles).filter(x=>x.name.toLocaleLowerCase('cs').startsWith(v.trim().toLocaleLowerCase('cs'))&&v.trim());let d=$('suggest-'+id);if(d){d.innerHTML=matches.slice(0,5).map(x=>`<button class="chip" type="button" data-pick="${esc(id)}" data-name="${esc(x.name)}">${esc(x.name)} <span style="color:${esc(x.color)}">●</span></button>`).join('');}}
function pickProfile(id,name){let p=S.players.find(x=>x.id===id),saved=profiles[name.toLocaleLowerCase('cs')];if(p&&saved){p.name=saved.name;p.color=saved.color;save();render()}}
function updateColor(id,color){let p=S.players.find(x=>x.id===id);if(!p)return;p.color=color;remember(p);if(S.started)render()}
function addPlayer(){if(S.players.length>=8)return;S.players.push({id:crypto.randomUUID(),name:'',color:COLORS[S.players.length]});save();render()}
function removePlayer(id){if(S.players.length<=2)return;S.players=S.players.filter(p=>p.id!==id);save();render()}
function movePlayer(id,delta){let i=playerIndex(id),j=i+delta;if(j<0||j>=S.players.length)return;[S.players[i],S.players[j]]=[S.players[j],S.players[i]];save();render()}
function changeMode(mode){S.mode=mode;save();render()}
function changeOrder(order){S.order=order;save();render()}
function start(){if(S.players.some(p=>!p.name.trim()))return alert('Vyplň jména všech hráčů.');let names=S.players.map(p=>p.name.trim().toLocaleLowerCase('cs'));if(new Set(names).size!==names.length)return alert('Každý hráč musí mít jiné jméno.');S.players.forEach(remember);if(S.order==='random'){for(let i=S.players.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[S.players[i],S.players[j]]=[S.players[j],S.players[i]]}}if(S.players.length===2)S.mode='winner';S.started=true;save();render()}
const game=id=>G.find(g=>g.id===id);
function totals(){let o=Object.fromEntries(S.players.map(p=>[p.id,0]));for(let h of S.history){if(h.first in o)o[h.first]+=h.firstPts;if(h.second in o)o[h.second]+=h.secondPts}return o}
function ranks(){let t=totals();return S.players.map(p=>({...p,points:t[p.id]})).sort((a,b)=>b.points-a.points)}
function champion(){let r=ranks();return r[0]?.points>=10?r[0]:null}
function played(){return new Set(S.history.map(h=>h.game))}
function valuesFor(tier){if(S.players.length<3||S.mode==='winner'){let v=Math.min(tier,3);return [v,v,0]}if(tier===1)return [1,1,0];if(tier===2)return [2,2,0];if(tier===3)return [3,2,1];return [5,3,2]}
function opening(){let vals=new Set(S.history.map(h=>h.value));return [1,2,3].filter(x=>!vals.has(x))}
function available(){let u=played(),need=opening();return G.filter(g=>!u.has(g.id)&&(!need.length||need.includes(valuesFor(g.tier)[0])))}
function selectGame(id){if(!available().some(g=>g.id===id)||champion())return;S.active={game:id,first:'',second:'',launched:false,matchId:crypto.randomUUID()};save();render()}
function setPlace(which,id){if(!S.active)return;S.active[which]=id;if(which==='first'&&S.active.second===id)S.active.second='';if(which==='second'&&S.active.first===id)S.active.first='';save();render()}
function record(){let a=S.active;if(!a||!a.first)return alert('Vyber vítěze disciplíny.');let g=game(a.game),[value,fp,sp]=valuesFor(g.tier);if(sp&&!a.second)return alert('Vyber také druhé místo.');if(a.first===a.second)return alert('První a druhé místo musí být různí hráči.');S.history.push({game:g.id,tier:g.tier,value,first:a.first,second:sp?a.second:null,firstPts:fp,secondPts:sp});S.active=null;save();render()}
function undo(){if(!S.history.length)return;if(!confirm('Vrátit poslední zapsaný výsledek?'))return;S.history.pop();S.active=null;S.finished=false;S.tiebreaks=[];save();render()}
function finish(){if(!confirm('Ukončit turnaj a zobrazit konečné pořadí?'))return;S.finished=true;S.active=null;save();render()}
function reopen(){S.finished=false;S.tiebreaks=[];save();render()}
function newTournament(){if(!confirm('Opravdu začít NOVÝ turnaj? Současné výsledky se smažou. Uložené profily hráčů zůstanou.'))return;let ps=S.players.map(p=>({...p}));S=initial();S.players=ps;save();render()}
function shuffleChallenge(){let tied=tieGroup();if(tied.length<2)return;let pool=G.map(g=>g.id);let id=pool[Math.floor(Math.random()*pool.length)];S.challenge={game:id,players:tied.map(p=>p.id),winner:''};save();render()}
function tieGroup(){let r=ranks(),settled=new Set(S.tiebreaks.flatMap(t=>t.players));for(let i=0;i<r.length;){let j=i+1;while(j<r.length&&r[j].points===r[i].points)j++;let group=r.slice(i,j).filter(p=>!settled.has(p.id));if(group.length>1)return group;i=j}return []}
function challengeWinner(id){if(S.challenge)S.challenge.winner=id;save();render()}
function saveChallenge(){let c=S.challenge;if(!c?.winner)return alert('Vyber vítěze Poslední výzvy.');S.tiebreaks.push({...c});S.challenge=null;save();render()}
function formatRank(){let r=ranks();let tb=S.tiebreaks;return r.sort((a,b)=>b.points-a.points||tb.reduce((n,t)=>n+(t.players.includes(a.id)&&t.players.includes(b.id)?(t.winner===a.id?-1:t.winner===b.id?1:0):0),0))}
function renderSetup(){let two=S.players.length===2;$('setup').innerHTML=`<h2>⚙️ Nastavení turnaje</h2><p class="sub">2–8 hráčů. Jména a barvy si aplikace pamatuje pro další turnaje.</p><h3>Hráči</h3>${S.players.map((p,i)=>`<div class="player"><div class="row"><input type="text" autocomplete="off" placeholder="Jméno hráče" value="${esc(p.name)}" data-name="${esc(p.id)}"><input type="color" aria-label="Barva ${esc(p.name)}" value="${esc(p.color)}" data-color="${esc(p.id)}"><button class="btn small" data-up="${esc(p.id)}" ${i===0?'disabled':''}>↑</button><button class="btn small" data-down="${esc(p.id)}" ${i===S.players.length-1?'disabled':''}>↓</button><button class="btn small danger" data-remove="${esc(p.id)}" ${two?'disabled':''}>×</button></div><div class="chips" id="suggest-${esc(p.id)}"></div></div>`).join('')}<button class="btn wide" data-action="add" ${S.players.length>=8?'disabled':''}>＋ Přidat hráče</button><h3>Pořadí hráčů</h3><label class="choice"><input type="radio" name="order" value="manual" ${S.order==='manual'?'checked':''}> Vlastní pořadí (šipkami ↑ ↓ výše)</label><label class="choice"><input type="radio" name="order" value="random" ${S.order==='random'?'checked':''}> Náhodné pořadí</label><h3>Bodování</h3>${two?'<div class="notice">Ve dvou hráčích platí původní pravidlo: vítěz bere vše (1, 2 nebo 3 body).</div>':`<label class="choice"><input type="radio" name="mode" value="winner" ${S.mode==='winner'?'checked':''}> Vítěz bere vše (1, 2, 3 body)</label><label class="choice"><input type="radio" name="mode" value="split" ${S.mode==='split'?'checked':''}> O body se dělí (1:0, 2:0, 2:1, 3:2)</label>`}<p class="sub">Nejprve povinně jedna disciplína za 1, 2 a 3 body v libovolném pořadí. Pak se odemknou ostatní. Vyhrává první hráč s alespoň 10 body.</p><button class="btn primary wide" data-action="start">▶ ZAČÍT TURNAJ</button>`}
const ELIM_LAUNCH='naseSipkyEliminaceLaunchV3', ELIM_RESULT='naseSipkyEliminaceResultV3';
const VYR_LAUNCH='naseSipkyVyrazkoLaunchV1', VYR_RESULT='naseSipkyVyrazkoResultV1';
const HOD_LAUNCH='naseSipkyHodinyLaunchV1',HOD_RESULT='naseSipkyHodinyResultV1';
const HIGH_LAUNCH='naseSipkyhighLaunchV1',HIGH_RESULT='naseSipkyhighResultV1';
const CLO_LAUNCH='naseSipkycloveceLaunchV1',CLO_RESULT='naseSipkycloveceResultV1';


const CRICKET_LAUNCH='naseSipkyCricketLaunchV1',CRICKET_RESULT='naseSipkyCricketResultV1';
function launchCricket(){
 if(!S.active||S.active.game!=='cricket')return;
 let a=S.active;localStorage.setItem(CRICKET_LAUNCH,JSON.stringify({matchId:a.matchId,players:S.players.map(p=>({id:p.id,name:p.name,color:p.color}))}));
 a.launched=true;save();location.href='./cricket.html?turnaj=1&match='+encodeURIComponent(a.matchId);
}
function importCricketResult(){
 let r;try{r=JSON.parse(localStorage.getItem(CRICKET_RESULT))}catch{}
 if(!r||!S.active||S.active.game!=='cricket'||r.matchId!==S.active.matchId||!S.players.some(p=>p.id===r.winner))return;
 S.active.first=r.winner;S.active.launched=true;save();localStorage.removeItem(CRICKET_RESULT);
}

function launchAdded(which){
 if(!S.active||S.active.game!==which)return;
 let key=which==='high'?HIGH_LAUNCH:CLO_LAUNCH;
 let a=S.active;localStorage.setItem(key,JSON.stringify({matchId:a.matchId,players:S.players.map(p=>({id:p.id,name:p.name,color:p.color}))}));
 a.launched=true;save();location.href='./'+which+'.html?turnaj=1&match='+encodeURIComponent(a.matchId);
}
function importAdded(which){
 let key=which==='high'?HIGH_RESULT:CLO_RESULT,r;try{r=JSON.parse(localStorage.getItem(key))}catch{}
 if(!r||!S.active||S.active.game!==which||r.matchId!==S.active.matchId||!S.players.some(p=>p.id===r.winner))return;
 S.active.first=r.winner;S.active.launched=true;save();localStorage.removeItem(key);
}
function launchHodiny(){
 if(!S.active||S.active.game!=='around')return;
 let a=S.active;
 localStorage.setItem(HOD_LAUNCH,JSON.stringify({matchId:a.matchId,players:S.players.map(p=>({id:p.id,name:p.name,color:p.color}))}));
 a.launched=true;save();location.href='./hodiny.html?turnaj=1&match='+encodeURIComponent(a.matchId);
}
function importHodinyResult(){
 let r;try{r=JSON.parse(localStorage.getItem(HOD_RESULT))}catch{}
 if(!r||!S.active||S.active.game!=='around'||r.matchId!==S.active.matchId)return;
 if(!S.players.some(p=>p.id===r.winner))return;
 S.active.first=r.winner;S.active.launched=true;save();localStorage.removeItem(HOD_RESULT);
}

function launchVyrazko(){
 if(!S.active||S.active.game!=='vyrazko')return;
 let a=S.active;localStorage.setItem(VYR_LAUNCH,JSON.stringify({matchId:a.matchId,players:S.players.map(p=>({id:p.id,name:p.name,color:p.color}))}));
 a.launched=true;save();location.href='./vyrazko.html?turnaj=1&match='+encodeURIComponent(a.matchId);
}
function importVyrazkoResult(){
 let r;try{r=JSON.parse(localStorage.getItem(VYR_RESULT))}catch{}
 if(!r||!S.active||S.active.game!=='vyrazko'||r.matchId!==S.active.matchId)return;
 if(!S.players.some(p=>p.id===r.winner))return;
 S.active.first=r.winner;S.active.launched=true;save();localStorage.removeItem(VYR_RESULT);
}
function launchEliminace(){
 if(!S.active||S.active.game!=='eliminace')return;
 const a=S.active;
 localStorage.setItem(ELIM_LAUNCH,JSON.stringify({matchId:a.matchId,players:S.players.map(p=>({id:p.id,name:p.name,color:p.color}))}));
 a.launched=true;save();
 location.href='./eliminace.html?turnaj=1&match='+encodeURIComponent(a.matchId);
}
function importEliminaceResult(){
 let r;try{r=JSON.parse(localStorage.getItem(ELIM_RESULT))}catch{}
 if(!r||!S.active||S.active.game!=='eliminace'||r.matchId!==S.active.matchId)return;
 if(!S.players.some(p=>p.id===r.winner))return;
 S.active.first=r.winner;S.active.launched=true;save();
 localStorage.removeItem(ELIM_RESULT);
}
function renderPlay(){let rs=ranks(),ch=champion(),done=S.finished||!!ch,need=opening();$('summary').innerHTML=`<div class="row between"><h2>🎯 ${done?'Konec turnaje':'Průběh turnaje'}</h2><span class="pill">${S.history.length} / ${G.length} disciplín</span></div>${ch?`<div class="notice success">🏆 Vítěz turnaje: <b style="color:${esc(ch.color)}">${esc(ch.name)}</b> (${ch.points} bodů)</div>`:done?'<div class="notice">Turnaj ukončen. Konečné pořadí je níže.</div>':`<div class="notice">${need.length?'Nejdřív odehrajte disciplíny za '+need.join(', ')+' bodů.':'Úvodní 1, 2 a 3 body jsou odehrané. Další hru vybírá vítěz předchozí disciplíny.'}</div>`}<p class="sub">Režim: ${S.mode==='split'&&S.players.length>=3?'O body se dělí':'Vítěz bere vše'} • Cíl: 10 bodů</p>`;
let sorted=done?formatRank():rs;$('scores').innerHTML=`<h2>${done?'🏆 Konečné pořadí':'📊 Průběžné pořadí'}</h2>${sorted.map((p,i)=>`<div class="score" style="--c:${esc(p.color)}"><span><span class="rank">${i+1}.</span> <span class="name">${esc(p.name)}</span></span><span class="points">${p.points} b.</span></div>`).join('')}`;
if(done){let tie=tieGroup(),c=S.challenge;$('choose').innerHTML=`<h2>🏁 Závěr turnaje</h2>${tie.length?`<p>Na stejném místě jsou: <b>${tie.map(p=>esc(p.name)).join(', ')}</b>. Můžete určit pořadí pomocí Poslední výzvy, nebo nechat shodu.</p>${c?`<div class="notice"><b>🎲 Poslední výzva: ${esc(game(c.game).name)}</b><p class="sub">Rychlá nejjednodušší varianta za 1 bod, i pokud už se hrála. X01 = 301, bez Double In/Out. Body se do turnaje nepřičítají.</p><p>Vyber vítěze rozstřelu:</p><div class="chips">${tie.map(p=>`<button class="chip ${c.winner===p.id?'on':''}" data-challenge="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div><button class="btn primary wide" data-action="saveChallenge">Potvrdit pořadí</button></div>`:`<button class="btn primary wide" data-action="challenge">🎲 POSLEDNÍ VÝZVA</button>`}`:'<p>Pořadí je určené, žádná nerozhodná místa už nezbývají.</p>'}<button class="btn wide" data-action="finish">✓ UKONČIT TURNAJ</button><button class="btn small" data-action="new">Nový turnaj</button>${!ch?'<button class="btn small" data-action="reopen">Pokračovat v turnaji</button>':''}`;}
else{let a=S.active,opts=available(),last=S.history.at(-1);$('choose').innerHTML=`<h2>🎮 Vyberte disciplínu</h2>${last?`<div class="next-pick" style="--player-color:${esc(S.players.find(p=>p.id===last.first)?.color||'#f1c65b')}"><div class="next-pick-label">🏆 DALŠÍ DISCIPLÍNU VYBÍRÁ</div><div class="next-pick-name">${esc(S.players.find(p=>p.id===last.first)?.name)}</div><div class="next-pick-detail">Vítěz předchozí hry 🎯</div></div>`:'<div class="next-pick"><div class="next-pick-label">🎯 PRVNÍ DISCIPLÍNA</div><div class="next-pick-detail">První hru vyberete společně.</div></div>'}${!a?opts.map(g=>{let [val,fp,sp]=valuesFor(g.tier);return `<button class="btn wide game" data-game="${g.id}"><span class="row between"><b>${esc(g.name)}</b><span class="pill">${val} ${val===1?'bod':val<5?'body':'bodů'}</span></span><span class="sub">🥇 ${fp} ${sp?' • 🥈 '+sp:''}</span></button>`}).join('')||'<p>Všechny disciplíny jsou odehrané.</p>':`<div class="notice"><b>${esc(game(a.game).name)}</b> • ${valuesFor(game(a.game).tier)[0]} bodů${a.game==='eliminace'?'ELIMINACE je připojená. Spusť ji níže, vítěz se převezme automaticky.':a.game==='vyrazko'?'VYŘAZKO je připojené. Spusť ho níže, vítěz se převezme automaticky.':a.game==='cricket'?'CRICKET je připojený. Spusť ho níže, vítěz se převezme automaticky.':a.game==='around'?'HODINY jsou připojené. Spusť je níže, vítěz se převezme automaticky.':'Samotná hra zatím není propojená. Odehrajte ji ve své samostatné aplikaci a zde zapište výsledek.'}</div>${a.game==='eliminace'?`<div class="panel"><h3>🎯 ELIMINACE – samostatná stránka</h3><p class="game-embed-note">Hra se otevře přes celou stránku bez posouvacího okna. Po vítězství klepni ve hře na ODEHRÁNO – ZPĚT DO TURNAJE.</p><button class="btn primary wide" data-action="launchEliminace">${a.launched?'▶ VRÁTIT SE DO ELIMINACE':'▶ SPUSTIT ELIMINACI'}</button>${a.first?`<div class="game-result-note">🏆 Výsledek převzat: ${esc(S.players.find(p=>p.id===a.first)?.name)}. ${valuesFor(game(a.game).tier)[2]?'Vyber ještě druhé místo a zapiš výsledek.':'Potvrď zapsání výsledku.'}</div>`:''}</div>`:''}${a.game==='vyrazko'?`<div class="panel"><h3>🎯 VYŘAZKO – samostatná stránka</h3><p class="game-embed-note">Hra se otevře na celé stránce. Před začátkem si vyberete 1, 2 nebo 3 figurky. Po vítězství klepněte na ODEHRÁNO – ZPĚT DO TURNAJE.</p><button class="btn primary wide" data-action="launchVyrazko">${a.launched?'▶ VRÁTIT SE DO VYŘAZKA':'▶ SPUSTIT VYŘAZKO'}</button>${a.first?`<div class="game-result-note">🏆 Výsledek převzat: ${esc(S.players.find(p=>p.id===a.first)?.name)}. ${valuesFor(game(a.game).tier)[2]?'Vyber ještě druhé místo a zapiš výsledek.':'Potvrď zapsání výsledku.'}</div>`:''}</div>`:''}${a.game==='around'?`<div class="panel"><h3>🎯 HODINY – samostatná stránka</h3><p class="game-embed-note">Hra se otevře přes celou stránku. Po vítězství klepni na ODEHRÁNO – ZPĚT DO TURNAJE.</p><button class="btn primary wide" data-action="launchHodiny">${a.launched?'▶ VRÁTIT SE DO HODIN':'▶ SPUSTIT HODINY'}</button>${a.first?`<div class="game-result-note">🏆 Výsledek převzat: ${esc(S.players.find(p=>p.id===a.first)?.name)}. Potvrď zapsání výsledku.</div>`:''}</div>`:''}${a.game==='cricket'?`<div class="panel"><h3>🎯 CRICKET – samostatná stránka</h3><p class="game-embed-note">Před hrou zvolíte režim bodování, pořadí čísel i pořadí hráčů. Po vítězství klepněte na ODEHRÁNO – ZPĚT DO TURNAJE.</p><button class="btn primary wide" data-action="launchCricket">${a.launched?'▶ VRÁTIT SE DO CRICKETU':'▶ SPUSTIT CRICKET'}</button>${a.first?`<div class="game-result-note">🏆 Výsledek převzat: ${esc(S.players.find(p=>p.id===a.first)?.name)}.</div>`:''}</div>`:''}${a.game==='high'||a.game==='clovece'?`<div class="panel"><h3>🎯 ${a.game==='high'?'NEJVYŠŠÍ SKÓRE':'ČLOVĚČE, NEZLOB SE'}</h3><p class="game-embed-note">Hra se otevře na samostatné stránce. Po dohrání klepni na ODEHRÁNO – ZPĚT DO TURNAJE.</p><button class="btn primary wide" data-action="${a.game==='high'?'launchHigh':'launchClovece'}">${a.launched?'▶ VRÁTIT SE DO HRY':'▶ SPUSTIT HRU'}</button>${a.first?`<div class="game-result-note">🏆 Výsledek převzat: ${esc(S.players.find(p=>p.id===a.first)?.name)}.</div>`:''}</div>`:''}<h3>🥇 Vítěz disciplíny</h3><div class="chips">${S.players.map(p=>`<button class="chip ${a.first===p.id?'on':''}" data-place="first" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>${valuesFor(game(a.game).tier)[2]?`<h3>🥈 Druhé místo</h3><div class="chips">${S.players.map(p=>`<button class="chip ${a.second===p.id?'on':''}" data-place="second" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>`:''}<button class="btn primary wide" data-action="record">✓ ZAPSAT VÝSLEDEK</button><button class="btn wide" data-action="cancel">← Změnit disciplínu</button>`}<button class="btn small" data-action="new">Nový turnaj</button>${S.history.length?'<button class="btn small" data-action="finish">Ukončit turnaj</button>':''}`;}
$('history').innerHTML=`<h2>📜 Odehrané disciplíny</h2>${S.history.length?S.history.map((h,i)=>{let p=S.players.find(p=>p.id===h.first),q=S.players.find(p=>p.id===h.second);return `<div class="result"><span class="tag">${i+1}. • ${h.value} b.</span> <b>${esc(game(h.game)?.name)}</b><div class="sub">🥇 ${esc(p?.name)} +${h.firstPts}${q?' • 🥈 '+esc(q.name)+' +'+h.secondPts:''}</div></div>`}).join(''):'<p class="sub">Zatím nic odehráno.</p>'}<button class="btn small" data-action="undo" ${!S.history.length?'disabled':''}>↶ Vrátit poslední výsledek</button>`;}
function render(){$('setup').classList.toggle('hidden',S.started);$('play').classList.toggle('hidden',!S.started);if(S.started)renderPlay();else renderSetup()}
document.addEventListener('input',e=>{if(e.target.dataset.name)updateName(e.target.dataset.name,e.target.value);if(e.target.dataset.color)updateColor(e.target.dataset.color,e.target.value)});
document.addEventListener('change',e=>{if(e.target.name==='mode')changeMode(e.target.value);if(e.target.name==='order')changeOrder(e.target.value);if(e.target.dataset.name){let p=S.players.find(p=>p.id===e.target.dataset.name);if(p)remember(p)}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.pick)return pickProfile(d.pick,d.name);if(d.up)return movePlayer(d.up,-1);if(d.down)return movePlayer(d.down,1);if(d.remove)return removePlayer(d.remove);if(d.game)return selectGame(d.game);if(d.place)return setPlace(d.place,d.id);if(d.challenge)return challengeWinner(d.challenge);switch(d.action){case'add':addPlayer();break;case'start':start();break;case'cancel':S.active=null;save();render();break;case'launchEliminace':launchEliminace();break;case'launchVyrazko':launchVyrazko();break;case'launchHodiny':launchHodiny();break;case'launchCricket':launchCricket();break;case'launchHigh':launchAdded('high');break;case'launchClovece':launchAdded('clovece');break;case'record':record();break;case'undo':undo();break;case'finish':finish();break;case'reopen':reopen();break;case'new':newTournament();break;case'challenge':shuffleChallenge();break;case'saveChallenge':saveChallenge();break;}});
importEliminaceResult();importVyrazkoResult();importHodinyResult();importAdded('high');importAdded('clovece');importCricketResult();render();
window.addEventListener('pageshow',()=>{importEliminaceResult();importVyrazkoResult();importHodinyResult();importAdded('high');importAdded('clovece');render()});
</script></body></html>
